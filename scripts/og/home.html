<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image: home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .body { flex: 1; display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 26px 34px 0; min-height: 0; }
  h1 { font-stretch: 125%; font-weight: 800; font-size: 112px; line-height: 0.9; letter-spacing: -0.02em; text-transform: uppercase; }
  .lead { margin-top: 20px; font-size: 27px; line-height: 1.32; color: var(--ink); max-width: 720px; }
  .chip { align-self: center; justify-self: center; width: 300px; height: 300px; }
  .proof { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--hair); margin: 0 34px; padding: 16px 0 22px; gap: 22px; }
  .proof div { min-width: 0; }
  .proof .big { font-stretch: 112%; font-weight: 800; font-size: 31px; line-height: 1.05; letter-spacing: -0.01em; display: block; }
  .proof .small { display: block; margin-top: 6px; font-size: 14.5px; line-height: 1.3; color: var(--ink-2); }
  .proof .tag { margin-top: 7px; font-size: 12px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"><b>AD2028</b><span>Computer Engineering · SJSU</span><span>aadityad.dev</span></div>
  <div class="body">
    <div>
      <h1>Aaditya<br>Desai</h1>
      <p class="lead" id="lead"></p>
    </div>
    <svg class="chip" viewBox="0 0 300 300" role="img" aria-label="Chip package marked AD2028">
      <defs>
        <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9d9d3"/><stop offset=".55" stop-color="#a3a39c"/><stop offset="1" stop-color="#7c7c76"/></linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262625"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
      </defs>
      <g id="leads"></g>
      <rect x="55" y="55" width="190" height="190" rx="6" fill="url(#body)"/>
      <rect x="61" y="61" width="178" height="178" rx="4" fill="none" stroke="#2c2c2b"/>
      <circle cx="82" cy="82" r="6" fill="var(--accent)"/>
      <text x="150" y="158" text-anchor="middle" fill="#e2e2dc" style="font-family:var(--sans);font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:-1px">AD2028</text>
      <text x="150" y="182" text-anchor="middle" fill="#c9c9c3" style="font-family:var(--mono);font-size:10px;letter-spacing:3px">AADITYA DESAI</text>
    </svg>
  </div>
  <div class="proof" id="proof"></div>
</div>
<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const leads = document.getElementById("leads");
  const lead = (x, y, w, h) => { const r = document.createElementNS(svgNS, "rect"); for (const [k, v] of Object.entries({ x, y, width: w, height: h, fill: "url(#pin)" })) r.setAttribute(k, v); leads.append(r); };
  for (let i = 1; i <= 7; i++) { const p = 55 + (190 / 8) * i; lead(29, p - 6, 26, 12); lead(245, p - 6, 26, 12); lead(p - 6, 29, 12, 26); lead(p - 6, 245, 12, 26); }
  fetch("notes.json").then((r) => r.json()).then((d) => {
    document.getElementById("lead").textContent = d.hero.lead;
    document.getElementById("proof").innerHTML = d.proof.map((p) =>
      `<div><span class="big"></span><span class="small"></span>${p.status ? `<span class="tag" data-s="${p.status}">${p.status}</span>` : ""}</div>`).join("");
    document.querySelectorAll("#proof div").forEach((el, i) => {
      el.querySelector(".big").textContent = d.proof[i].big;
      el.querySelector(".small").textContent = d.proof[i].small;
    });
    document.fonts.ready.then(() => document.body.setAttribute("data-ready", ""));
  });
</script>
</body>
</html>
