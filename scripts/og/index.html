<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image: Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .body { flex: 1; padding: 26px 34px; }
  h1 { font-size: 88px; line-height: 1; font-weight: 800; font-stretch: 125%; letter-spacing: -0.03em; }
  ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(5, auto); gap: 0 44px; list-style: none; padding: 0; margin-top: 24px; }
  li { display: flex; align-items: baseline; gap: 18px; border-top: 1px solid var(--hair); padding: 11px 0; font-family: var(--mono); font-size: 25px; }
  .number { color: var(--accent); font-size: 17px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"><b>Aaditya Desai</b><span>Computer Engineering · SJSU</span><span>aadityad.dev</span></div>
  <div class="body"><h1>Work</h1><ol id="projects"></ol></div>
</div>
<script>
  fetch("notes.json").then((r) => r.json()).then((d) => {
    const list = document.getElementById("projects");
    for (const note of [...d.notes].sort((a, b) => a.order - b.order)) {
      const row = document.createElement("li");
      const number = document.createElement("span");
      number.className = "number";
      number.textContent = String(note.order).padStart(2, "0");
      const title = document.createElement("span");
      title.textContent = note.title;
      row.append(number, title); list.append(row);
    }
    document.fonts.ready.then(() => document.body.setAttribute("data-ready", ""));
  });
</script>
</body>
</html>
