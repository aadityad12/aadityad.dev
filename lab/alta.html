<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALTA · project artifact study</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=block" rel="stylesheet">
<link rel="stylesheet" href="./alta-artifact.css">
<style>
*{box-sizing:border-box}
html{color:#211946;background:#EEECF7;font:400 14px/1.7 Manrope,system-ui,sans-serif}
body{margin:0}
main{max-width:1120px;margin:0 auto;padding:44px 28px 64px}
.study-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px;font:400 10px/1.5 "DM Mono",monospace;letter-spacing:.06em}
.study-head button{border:0;border-bottom:1px solid #5A528055;background:transparent;color:inherit;font:inherit;padding:3px 0;min-height:36px;cursor:pointer}
button:focus-visible{outline:2px solid #B5321F;outline-offset:5px}
.study-sizes{display:flex;align-items:flex-start;justify-content:center;gap:48px;flex-wrap:wrap}
.study-size{display:flex;flex-direction:column;gap:12px}
.study-size>p{margin:0;font:400 9px/1.5 "DM Mono",monospace;letter-spacing:.06em;color:#5A5280;text-transform:uppercase}
.study-desktop{width:540px}
.study-phone{width:340px}
@media(max-width:960px){.study-sizes{flex-direction:column;align-items:center}}
@media(max-width:600px){main{padding:24px 14px 40px}.study-desktop,.study-phone{width:100%}.study-phone{max-width:340px}}
</style>
</head>
<body>
<main>
<header class="study-head"><span>PROJECT ARTIFACTS / ALTA</span><button type="button" id="study-motion" aria-pressed="false">Pause motion</button></header>
<div class="study-sizes">
  <div class="study-size study-desktop"><p>Desktop card · 540 px</p><div id="alta-desktop"></div></div>
  <div class="study-size study-phone"><p>Phone card · 340 px</p><div id="alta-phone"></div></div>
</div>
</main>
<script type="module">
import { createAltaArtifact, setAltaPaused } from "./alta-artifact.js";
document.getElementById("alta-desktop").append(createAltaArtifact());
document.getElementById("alta-phone").append(createAltaArtifact());
const preference = matchMedia("(prefers-reduced-motion: reduce)");
const motion = document.getElementById("study-motion");
let paused = preference.matches;
function updateMotion() {
  setAltaPaused(paused);
  motion.textContent = paused ? "Resume motion" : "Pause motion";
  motion.setAttribute("aria-pressed", String(paused));
}
motion.addEventListener("click", () => { paused = !paused; updateMotion(); });
preference.addEventListener("change", (event) => { paused = event.matches; updateMotion(); });
updateMotion();
</script>
</body>
</html>
